<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ripple — Runs with Gates</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card: #131822;
      --border: #232b3b;
      --fg: #e6edf3;
      --muted: #8b949e;
      --primary: #58a6ff;
      --success: #3fb950;
      --warning: #d29922;
      --error: #f85149;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); font-size: 13px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--card); gap: 12px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
    .logo { width: 28px; height: 28px; border-radius: 7px; background: var(--primary); color: #0b0e14; display: grid; place-items: center; font-weight: 800; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; border: 1px solid var(--border); color: var(--muted); font-family: ui-monospace, monospace; }
    .pill.ok { color: var(--success); border-color: rgba(63,185,80,.4); }
    .pill.warn { color: var(--warning); border-color: rgba(210,153,34,.4); }
    .pill.err { color: var(--error); border-color: rgba(248,81,73,.4); }
    .pill.pri { color: var(--primary); border-color: rgba(88,166,255,.4); }
    main { display: grid; grid-template-columns: 300px 1fr 340px; gap: 14px; padding: 14px 20px; max-width: 1440px; margin: 0 auto; }
    @media (max-width: 1024px) { main { grid-template-columns: 1fr; } }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
    h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
    .row { padding: 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; background: rgba(255,255,255,.02); }
    .row.active { border-color: var(--primary); background: rgba(88,166,255,.08); }
    button { background: #1f2735; color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
    button:hover { border-color: var(--primary); }
    button.primary { background: var(--primary); color: #0b0e14; border-color: var(--primary); font-weight: 600; }
    button.success { background: var(--success); color: #0b0e14; border-color: var(--success); font-weight: 600; }
    button.danger { color: var(--error); border-color: rgba(248,81,73,.5); }
    input, textarea { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; font-size: 12px; }
    pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; overflow-x: auto; font-size: 11px; margin: 6px 0; }
    .flex { display: flex; gap: 6px; align-items: center; }
    .between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .muted { color: var(--muted); font-size: 12px; }
    .mono { font-family: ui-monospace, monospace; }
    .events { max-height: 220px; overflow-y: auto; font-family: ui-monospace, monospace; font-size: 11px; }
    .ev { padding: 4px 0; border-bottom: 1px solid var(--border); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">R</div>
      <span>Ripple</span>
      <span class="pill pri">Runs with Gates</span>
      <span id="sse-status" class="pill">connecting...</span>
    </div>
    <div class="flex">
      <input id="token-input" type="password" placeholder="Bearer token (rpl_...)" style="width: 220px;" />
      <button onclick="saveToken()" class="primary">Connect</button>
    </div>
  </header>

  <main>
    <!-- LEFT: Backlog + Flow Lane -->
    <section>
      <div class="panel">
        <h2>Backlog <span id="items-count" class="pill">0</span></h2>
        <div id="items-list"></div>
        <form onsubmit="createItem(event)" class="flex" style="margin-top:8px;">
          <input id="new-item-title" placeholder="New backlog item..." />
          <button type="submit">Add</button>
        </form>
      </div>

      <div class="panel">
        <h2>Flow Lane <span id="flows-count" class="pill">0</span></h2>
        <div id="flows-list"></div>
      </div>

      <div class="panel">
        <h2>Connected Agents</h2>
        <div id="agents-list" class="muted"></div>
      </div>
    </section>

    <!-- CENTER: Live Run Timeline + Event Stream -->
    <section>
      <div class="panel">
        <h2>Live Run Timeline <span id="runs-count" class="pill">0 runs</span></h2>
        <div id="run-selector" class="flex" style="flex-wrap:wrap; margin-bottom:10px;"></div>
        <div id="run-detail" class="muted">Select or start a run (an agent calling <code>ripple_claim</code> or trigger a Flow).</div>
      </div>

      <div class="panel">
        <h2>Protocol Event Log (SSE) <span class="pill">monotonic seq</span></h2>
        <div id="events-list" class="events"></div>
      </div>
    </section>

    <!-- RIGHT: Decisions Tray + Scoped Thread -->
    <section>
      <div class="panel">
        <h2>Decisions Tray <span id="open-cards-pill" class="pill warn">0 open</span></h2>
        <div id="cards-list" class="muted">No open Cards.</div>
      </div>

      <div class="panel">
        <h2>Scoped Thread</h2>
        <div id="thread-list" style="max-height:200px; overflow-y:auto; margin-bottom:8px;"></div>
        <form onsubmit="postThread(event)">
          <input id="thread-input" placeholder="Comment on selected run..." />
          <div class="between" style="margin-top:6px;">
            <label class="muted"><input id="thread-steer" type="checkbox" style="width:auto;" /> Send to agent as steer</label>
            <button type="submit">Post</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script>
    let token = localStorage.getItem('ripple_token') || 'rpl_human_dev_token';
    document.getElementById('token-input').value = token;
    let snapshot = null;
    let selectedRunId = null;
    let evtSource = null;

    function saveToken() {
      token = document.getElementById('token-input').value.trim();
      localStorage.setItem('ripple_token', token);
      loadSnapshot();
      connectSSE();
    }

    async function api(method, path, body) {
      const res = await fetch(path, {
        method,
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        alert(data.message || data.error || `HTTP ${res.status}`);
        throw new Error(data.error || 'request failed');
      }
      return data;
    }

    async function loadSnapshot() {
      try {
        snapshot = await api('GET', '/api/v1/snapshot');
        if (!selectedRunId && snapshot.runs.length > 0) selectedRunId = snapshot.runs[0].id;
        render();
        if (selectedRunId) loadThread(selectedRunId);
      } catch (e) {
        document.getElementById('sse-status').textContent = 'auth error';
        document.getElementById('sse-status').className = 'pill err';
      }
    }

    function connectSSE() {
      if (evtSource) evtSource.close();
      evtSource = new EventSource(`/api/v1/events?token=${encodeURIComponent(token)}`);
      evtSource.onopen = () => {
        const el = document.getElementById('sse-status');
        el.textContent = 'SSE live';
        el.className = 'pill ok';
      };
      evtSource.onerror = () => {
        const el = document.getElementById('sse-status');
        el.textContent = 'reconnecting...';
        el.className = 'pill warn';
      };
      evtSource.onmessage = () => loadSnapshot();
      ['item.created','run.claimed','run.planned','run.step','run.checkpoint','run.fenced','run.done','run.resumed','run.heartbeat_lost','steer.queued','steer.delivered','steer.acked','card.opened','card.stale','card.answered','artifact.added','flow.triggered','thread.message'].forEach(t => {
        evtSource.addEventListener(t, () => loadSnapshot());
      });
    }

    async function createItem(e) {
      e.preventDefault();
      const input = document.getElementById('new-item-title');
      if (!input.value.trim()) return;
      await api('POST', '/api/v1/items', { title: input.value.trim(), priority: 'P1' });
      input.value = '';
      loadSnapshot();
    }

    async function triggerFlow(flowId) {
      const res = await api('POST', `/api/v1/flows/${flowId}/trigger`);
      selectedRunId = res.run.id;
      loadSnapshot();
    }

    async function steerStep(runId, idx) {
      const title = prompt(`Steer step ${idx} — new instruction:`);
      if (!title) return;
      const urgent = confirm('Mark as urgency: now (deliver on next heartbeat <=60s)? Cancel = next checkpoint.');
      await api('POST', `/api/v1/runs/${runId}/steers`, {
        op: 'edit',
        urgency: urgent ? 'now' : 'normal',
        payload: { step_idx: idx, title },
      });
      loadSnapshot();
    }

    async function takeover(runId) {
      await api('POST', `/api/v1/runs/${runId}/takeover`);
      loadSnapshot();
    }

    async function answerCard(cardId, option, onPin) {
      await api('POST', `/api/v1/cards/${cardId}/answer`, { option, onPin });
      loadSnapshot();
    }

    async function loadThread(runId) {
      const msgs = await api('GET', `/api/v1/threads/run/${runId}`);
      document.getElementById('thread-list').innerHTML = msgs.length === 0
        ? '<div class="muted">No messages on this run yet.</div>'
        : msgs.map(m => `<div class="row"><strong>${esc(m.author)}</strong> ${m.steerId ? '<span class="pill pri">steer</span>' : ''}<div>${esc(m.body)}</div></div>`).join('');
    }

    async function postThread(e) {
      e.preventDefault();
      if (!selectedRunId) return alert('Select a run first');
      const input = document.getElementById('thread-input');
      const sendToAgent = document.getElementById('thread-steer').checked;
      if (!input.value.trim()) return;
      await api('POST', `/api/v1/threads/run/${selectedRunId}`, { body: input.value.trim(), sendToAgent });
      input.value = '';
      document.getElementById('thread-steer').checked = false;
      loadThread(selectedRunId);
      loadSnapshot();
    }

    function selectRun(id) {
      selectedRunId = id;
      render();
      loadThread(id);
    }

    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

    function render() {
      if (!snapshot) return;
      document.getElementById('items-count').textContent = snapshot.items.length;
      document.getElementById('items-list').innerHTML = snapshot.items.map(i => `
        <div class="row">
          <div class="between"><strong>${esc(i.title)}</strong><span class="pill">${esc(i.status)}</span></div>
          <div class="muted mono">${esc(i.id)} · ${esc(i.priority)}</div>
        </div>
      `).join('') || '<div class="muted">No items</div>';

      document.getElementById('flows-count').textContent = snapshot.flows.length;
      document.getElementById('flows-list').innerHTML = snapshot.flows.map(f => `
        <div class="row">
          <div class="between"><strong>${esc(f.name)}</strong><button onclick="triggerFlow('${esc(f.id)}')">Run</button></div>
          <div class="muted">${esc(f.triggerKind)} ${esc(f.triggerSpec)} · agent: <code>${esc(f.agentId)}</code></div>
        </div>
      `).join('');

      document.getElementById('agents-list').innerHTML = snapshot.agents.map(a => `
        <div class="between" style="padding:3px 0;"><span>${esc(a.actorName)}</span><span class="pill">${esc(a.kind)}</span></div>
      `).join('');

      document.getElementById('runs-count').textContent = `${snapshot.runs.length} runs`;
      document.getElementById('run-selector').innerHTML = snapshot.runs.map(r => `
        <button onclick="selectRun('${esc(r.id)}')" class="${r.id === selectedRunId ? 'primary' : ''}">${esc(r.id)} (${esc(r.ownerAgent)} · ${esc(r.status)})</button>
      `).join('');

      const run = snapshot.runs.find(r => r.id === selectedRunId);
      if (!run) {
        document.getElementById('run-detail').innerHTML = '<div class="muted">No active runs yet. Trigger a Flow or have an agent call <code>ripple_claim</code>.</div>';
      } else {
        document.getElementById('run-detail').innerHTML = `
          <div class="between" style="margin-bottom:10px;">
            <div>
              <strong>${esc(run.id)}</strong> · agent <code>${esc(run.ownerAgent)}</code>
              <span class="pill pri">plan v${run.planVersion}</span>
              <span class="pill">epoch ${run.epoch}</span>
              <span class="pill ${run.status === 'done' ? 'ok' : run.status === 'gated' ? 'warn' : run.status === 'overridden' || run.status === 'stalled' ? 'err' : 'pri'}">${esc(run.status)}</span>
            </div>
            <button onclick="takeover('${esc(run.id)}')" class="danger">Takeover (fence)</button>
          </div>
          ${run.touches.length ? `<div class="muted" style="margin-bottom:8px;">Touches: <code class="mono">${esc(run.touches.join(', '))}</code></div>` : ''}
          ${run.steps.map(s => `
            <div class="row ${s.status === 'active' ? 'active' : ''}">
              <div class="between">
                <span><strong>${s.idx}.</strong> ${esc(s.title)} ${s.kind === 'gate' ? '<span class="pill warn">GATE</span>' : ''}</span>
                <div class="flex">
                  <button onclick="steerStep('${esc(run.id)}', ${s.idx})">Steer</button>
                  <span class="pill">${esc(s.status)}</span>
                </div>
              </div>
              ${s.note ? `<div class="muted" style="margin-top:4px;">${esc(s.note)}</div>` : ''}
            </div>
          `).join('') || '<div class="muted">Waiting for agent to post plan v1...</div>'}
          ${run.steers.length ? `<div style="margin-top:8px;"><div class="muted">Steers:</div>${run.steers.map(st => `<div class="row"><code>${esc(st.id)}</code> [${esc(st.status)}] ${esc(JSON.stringify(st.payload))}</div>`).join('')}</div>` : ''}
          ${run.artifacts.length ? `<div style="margin-top:8px;"><div class="muted">Artifacts:</div>${run.artifacts.map(a => `<div class="row between"><span>${esc(a.label)}</span><code class="mono">${esc(a.ref)}</code></div>`).join('')}</div>` : ''}
        `;
      }

      const openCards = snapshot.cards.filter(c => c.status === 'open');
      document.getElementById('open-cards-pill').textContent = `${openCards.length} open`;
      document.getElementById('cards-list').innerHTML = snapshot.cards.map(c => `
        <div class="row">
          <div class="between">
            <strong>${esc(c.prompt)}</strong>
            <span class="pill ${c.status === 'open' ? 'warn' : c.status === 'answered' ? 'ok' : 'err'}">${esc(c.status)}</span>
          </div>
          <div class="muted mono">${esc(c.id)} · pin ${esc(c.pin.kind)}:${esc(c.pin.value)} · ${esc(c.runId)}</div>
          ${c.diffPreview ? `<pre>${esc(c.diffPreview)}</pre>` : ''}
          ${c.status === 'open' ? `
            <div class="flex" style="margin-top:6px; flex-wrap:wrap;">
              ${(c.options.length ? c.options : ['approve', 'reject']).map(opt => `
                <button onclick="answerCard('${esc(c.id)}', '${esc(opt)}', '${esc(c.pin.value)}')" class="${opt === 'approve' ? 'success' : opt === 'reject' ? 'danger' : 'primary'}">${esc(opt)}</button>
              `).join('')}
            </div>
          ` : c.status === 'answered' ? `<div class="muted">Decided: <strong>${esc(c.answerOption)}</strong> on ${esc(c.decidedOnPin)}</div>` : `<div class="muted">Invalidated → replaced by ${esc(c.replacedBy || 'n/a')}</div>`}
        </div>
      `).join('') || '<div class="muted">No Cards yet.</div>';

      document.getElementById('events-list').innerHTML = snapshot.events.map(e => `
        <div class="ev"><span class="muted">#${e.seq}</span> <strong style="color:var(--primary)">${esc(e.type)}</strong> <span class="muted">${esc(e.entityId)} ${esc(JSON.stringify(e.payload))}</span></div>
      `).join('');
    }

    loadSnapshot();
    connectSSE();
  </script>
</body>
</html>
